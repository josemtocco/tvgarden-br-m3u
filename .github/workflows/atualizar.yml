name: Atualizar lista TV Garden Brasil

on:
  schedule:
    # GitHub Actions usa UTC.
    # Executa aproximadamente a cada 6 horas.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar playlist
        run: python atualizar.py

      - name: Commitar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u descoberto.json status.json fontes.json
          git diff --cached --quiet || git commit -m "Atualizar lista TV Garden Brasil"

      - name: Enviar atualização
        run: git push
